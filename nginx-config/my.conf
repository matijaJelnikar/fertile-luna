server {
    # Catch-all: answer for any Host (luna.jelnikar.dev via the outer proxy, the LAN IP, ...),
    # otherwise nginx:alpine's bundled default.conf takes the request and /api/ 404s
    listen 80 default_server;
    server_name _;

    # Serve the Angular app from the correct location
    location / {
        root /usr/share/nginx/html;  # Ensure this points to the mounted /usr/share/nginx/html
        try_files $uri $uri/ /index.html;  # Ensure routing works for Angular SPA
    }

    # API calls should be forwarded to the backend API
    location /api/ {
        proxy_pass http://backend_api:3000;  # Proxy API calls to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
