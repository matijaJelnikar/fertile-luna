<div
  class="fab-container"
  [class.bottom-right]="position() === 'bottom-right'"
  [class.bottom-left]="position() === 'bottom-left'"
>
  <button
    mat-fab
    type="button"
    [color]="color()"
    [attr.aria-label]="label()"
    (click)="fabClick.emit()"
  >
    <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
  </button>
</div>
