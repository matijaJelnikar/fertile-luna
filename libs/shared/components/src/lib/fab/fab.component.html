<div
  class="fixed bottom-[85px] z-1000"
  [class.right-4]="position() === 'bottom-right'"
  [class.left-4]="position() === 'bottom-left'"
>
  <button
    mat-fab
    type="button"
    [color]="color()"
    [attr.aria-label]="label()"
    (click)="fabClick.emit()"
  >
    <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
  </button>
</div>
