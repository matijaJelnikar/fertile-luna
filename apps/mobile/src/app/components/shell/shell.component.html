<div class="shell-container">
  <mat-toolbar class="toolbar-container">
    <div class="title">
      <h1 class="mat-headline-1">{{ 'app.name' | translate }}</h1>
    </div>
    <div class="user-avatar">
      <div class="user-dropdown">
        <button
          type="button"
          class="user-icon"
          [matMenuTriggerFor]="menu"
          [attr.aria-label]="'profile.avatar' | translate"
        >
          <span
            class="user-avatar"
            aria-hidden="true"
            [style.background-image]="'url(resources/avatar_woman.png)'"
          ></span>
        </button>

        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="logout()">
            <mat-icon aria-hidden="true">logout</mat-icon>
            {{ 'common.logout' | translate }}
          </button>
        </mat-menu>
      </div>
    </div>
  </mat-toolbar>

  <main class="main-content">
    <router-outlet />
  </main>

  <nav class="bottom-nav-wrapper" [attr.aria-label]="'nav.label' | translate">
    <div class="bottom-nav-container">
      @for (item of navItems; track item.path) {
        <a
          class="nav-button"
          [routerLink]="item.path"
          routerLinkActive="selected"
          ariaCurrentWhenActive="page"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          {{ item.labelKey | translate }}
        </a>
      }
    </div>
  </nav>
</div>
