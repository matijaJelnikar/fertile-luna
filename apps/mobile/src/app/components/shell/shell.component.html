<div class="shell-container">
  <mat-toolbar class="toolbar-container">
    <div class="left">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="28px"
        viewBox="0 -960 960 960"
        width="28px"
        fill="#880e4f"
      >
        <path
          d="M480-885q49 59 88 109.5t70 96.5l242-181v380q0 83-31.5 156T763-197q-54 54-127 85.5T480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480v-380l242 181q31-45 70-96t88-110ZM160-700v220q0 44 11.5 84.5T203-320q-2-10-2.5-19.5T200-360q0-57 18.5-117.5T279-610l-119-90Zm320-60Q370-626 325-526t-45 166q0 83 58.5 141.5T480-160q83 0 141.5-58.5T680-360q0-66-45-167T480-760Zm320 60-119 89q42 72 60.5 132.5T760-360q0 11-.5 20.5T757-320q20-35 31.5-75.5T800-480v-220Z"
        />
      </svg>
      <span> {{ 'app.name' | translate }} </span>
    </div>
    <div class="right">
      @if(isLoggedIn){
      <div class="user-dropdown">
        <mat-icon class="user-icon" [matMenuTriggerFor]="menu" tabindex="0">
          <mat-icon
            class="user-avatar"
            [style.background-image]="'url(resources/avatar_woman.png)'"
            alt="User Avatar"
          ></mat-icon>
        </mat-icon>

        <!-- MatMenu for dropdown options -->
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            Logout
          </button>
        </mat-menu>
      </div>
      }
    </div>
  </mat-toolbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <div class="bottom-nav-wrapper">
    <div class="bottom-nav-container">
      <div
        class="nav-button"
        [tabindex]="0"
        [ngClass]="{ selected: selectedTab === Navigation.HOME }"
        role="button"
        (click)="selectTab(Navigation.HOME)"
        (keydown.enter)="selectTab(Navigation.HOME)"
        (keydown.space)="selectTab(Navigation.HOME)"
        [routerLink]="['/home']"
      >
        <mat-icon>home</mat-icon>
        Home
      </div>
      <div
        class="nav-button"
        [ngClass]="{ selected: selectedTab === Navigation.HISTORY }"
        [tabindex]="1"
        role="button"
        (click)="selectTab(Navigation.HISTORY)"
        (keydown.enter)="selectTab(Navigation.HISTORY)"
        (keydown.space)="selectTab(Navigation.HISTORY)"
        [routerLink]="['/history']"
      >
        <mat-icon>history</mat-icon>
        History
      </div>
      <div
        class="nav-button"
        [tabindex]="2"
        [ngClass]="{ selected: selectedTab === Navigation.SETTINGS }"
        role="button"
        (click)="selectTab(Navigation.SETTINGS)"
        (keydown.enter)="selectTab(Navigation.SETTINGS)"
        (keydown.space)="selectTab(Navigation.SETTINGS)"
        [routerLink]="['/settings']"
      >
        <mat-icon>settings</mat-icon>
        Settings
      </div>
    </div>
  </div>
</div>
