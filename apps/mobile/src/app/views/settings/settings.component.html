<div>
  <h2>{{ 'settings' | translate }}</h2>
  <div class="flex items-center gap-1.5">
    <mat-icon aria-hidden="true">light_mode</mat-icon>
    <mat-slide-toggle
      [checked]="isDarkMode()"
      (change)="onDarkModeChange($event.checked)"
      color="primary"
      [attr.aria-label]="'settings.dark.mode' | translate"
    >
    </mat-slide-toggle>
    <mat-icon aria-hidden="true">dark_mode</mat-icon>
  </div>

  <button mat-stroked-button type="button" (click)="startNewCycle()">
    <mat-icon aria-hidden="true">add_circle_outline</mat-icon>
    {{ 'settings.cycle.start' | translate }}
  </button>

  <mat-form-field appearance="outline">
    <mat-label>{{ 'settings.contraception.stopped' | translate }}</mat-label>
    <input
      matInput
      [matDatepicker]="stoppedPicker"
      [value]="contraceptionStoppedOn()"
      (dateChange)="onContraceptionStoppedOnChange($event.value)"
    />
    <mat-hint>{{ 'settings.contraception.hint' | translate }}</mat-hint>
    <mat-datepicker-toggle matIconSuffix [for]="stoppedPicker" />
    <mat-datepicker touchUi #stoppedPicker />
  </mat-form-field>
  @if (contraceptionStoppedOn()) {
    <button
      mat-button
      type="button"
      (click)="onContraceptionStoppedOnChange(null)"
    >
      {{ 'settings.contraception.clear' | translate }}
    </button>
  }
</div>
