<section class="temperature-section">
  <section class="safe-sex">
    <h3>Safe Sex Advisement</h3>
    <p>Low Risk<br /><span>Based on fertility data</span></p>
  </section>
  <div class="chart-placeholder">
    <lib-temperatures-chart
      [temperatureData]="temperatureData()"
      [timestampData]="timestampData()"
    ></lib-temperatures-chart>
  </div>
  <div class="cycle-navigation">
    <button mat-button (click)="previousCycle()">
      <mat-icon>chevron_left</mat-icon> Previous
    </button>
    <span class="cycle-indicator">Cycle {{ currentCycleNumber }}</span>
    <button mat-button (click)="nextCycle()">
      Next <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</section>

<section class="cycle-details">
  <h3>Cycle Details</h3>
  <p>Today<br /><span>Day 25 of 28-day cycle</span></p>
  <p>
    Bleeding <span class="right">0 days left <mat-icon>event</mat-icon></span>
  </p>
</section>

<lib-fab
  icon="add"
  color="primary"
  position="bottom-right"
  (fabClick)="addRecord()"
></lib-fab>
