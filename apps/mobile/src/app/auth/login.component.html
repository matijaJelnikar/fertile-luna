<div
  fxFill
  fxLayout="column"
  fxLayoutAlign="center center"
  fxLayoutGap="1.5rem"
  class="mat-typography"
>
  <div>
    <h1 fxLayoutAlign="center" translate>{{ 'APP_NAME' | translate }}</h1>
    <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="2rem">
      <h4 class="version">{{ 'VERSION' | translate }}</h4>
    </div>
  </div>
  <div class="login-container" fxLayout="row" fxLayoutAlign="center">
    <mat-card
      fxFlex="90%"
      fxFlex.sm="66%"
      fxFlex.md="50%"
      fxFlex.gt-md="33%"
      class="login-box"
    >
      <form (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
        <div class="login-error" [hidden]="!error || isLoading" translate>
          {{ 'LOGIN_CREDENTIALS_INCORRECT' | translate }}
        </div>
        <br />
        <div class="login-fields" fxLayout="column">
          <mat-form-field [hideRequiredMarker]="true">
            <input
              type="text"
              matInput
              formControlName="username"
              autocomplete="username"
              [placeholder]="'Username'"
              required
            />
            <mat-error
              *ngIf="
                loginForm.controls['username'].invalid &&
                loginForm.controls['username'].touched
              "
            >
              <span translate>{{ 'USERNAME_REQUIRED' | translate }}</span>
            </mat-error>
          </mat-form-field>
          <mat-form-field [hideRequiredMarker]="true">
            <input
              type="password"
              matInput
              formControlName="password"
              autocomplete="current-password"
              [placeholder]="'Password'"
              required
            />
            <mat-error
              *ngIf="
                loginForm.controls['password'].invalid &&
                loginForm.controls['password'].touched
              "
            >
              <span translate>{{ 'PASSWORD_REQUIRED' | translate }}</span>
            </mat-error>
          </mat-form-field>
          <mat-slide-toggle
            color="primary"
            formControlName="remember"
            translate
            >{{ 'REMEMBER_ME' | translate }}</mat-slide-toggle
          >
          <br />
          <br />
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="loginForm.invalid || isLoading"
          >
            <!-- <app-loader class="inline-loader" [isLoading]="isLoading"></app-loader> -->
            <span translate>{{ 'LOGIN' | translate }}</span>
          </button>
        </div>
      </form>
    </mat-card>
  </div>
</div>
